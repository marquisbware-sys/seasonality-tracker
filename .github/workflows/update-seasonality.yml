name: update-seasonality

# Seasonal stats change slowly (they're multi-year aggregates), so this
# runs weekly rather than daily. The "current window" is the only piece
# that shifts day to day, and a weekly refresh keeps it close enough.
# Run it by hand anytime from the Actions tab for an immediate update.

on:
  schedule:
    - cron: "0 12 * * 1"   # Mondays 12:00 UTC (pre-week refresh)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Run seasonality calculator
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
        run: python calculate_seasonality.py

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add seasonality_data.json
          git diff --quiet --cached || git commit -m "Update seasonality $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
